<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4D45">
<title>做人知識庫</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --ink:#1B1B1B; --ink2:#333333; --muted:#4A4A4A;
  --line:#D9D3C7; --line2:#B9B1A2; --accent:#0E4D45; --accent-dark:#08332E;
  --hit:#FFF8E6; --hit-line:#B7791F; --hit-ink:#5C3D00; --star:#C98A12; --danger:#9B1C1C;
  --serif:'Noto Serif TC','Songti TC',serif; --sans:'Noto Sans TC','PingFang TC',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--hit-line);outline-offset:2px}
.view{padding-bottom:calc(96px + var(--safe-b))}
.wrap{padding:0 16px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}
.page-title{font-size:26px;padding:18px 16px 4px}
.page-sub{font-size:16px;color:var(--ink2);padding:0 16px 12px}
.sec-title{font-family:var(--serif);font-size:20px;margin:22px 16px 10px}
.btn{min-height:48px;padding:0 20px;border-radius:24px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.solid{background:var(--accent);color:#fff}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45}
.icon-btn{width:44px;height:44px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:22px;flex:none}
.pill{display:inline-block;background:var(--accent);color:#fff;font-size:15px;font-weight:500;padding:3px 12px;border-radius:999px}
.pill.out{background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:2px 11px}
.empty{margin:24px 16px;padding:22px 18px;border:1.5px dashed var(--line2);border-radius:14px;font-size:17px;color:var(--ink2);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:16px;z-index:60;max-width:90vw;text-align:center}
/* home */
.today-card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 16px 12px}
.today-card .one{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.45;color:var(--accent);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.today-card .rv{font-size:14px;color:var(--muted);margin-top:8px}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 16px 10px}
.sec-row .sec-title{margin:0}
.swap{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-size:16px;font-weight:500}
.result{position:relative}
.star-mark{position:absolute;top:12px;right:14px;color:var(--star);font-size:18px;line-height:1}
.today-card .ttl{font-size:17px;font-weight:500;margin-top:6px}
.today-card .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:15px;color:var(--ink2)}
.today-card .kind{font-size:14px;color:var(--muted);margin-bottom:4px}
.row-link{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row-link .t{font-weight:500}
.row-link .s{font-size:15px;color:var(--ink2)}
/* library */
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px}
.search-box{display:flex;align-items:center;background:var(--surface);border:2px solid var(--line2);border-radius:26px;padding:0 6px 0 16px}
.search-box:focus-within{border-color:var(--accent)}
.search-box input{flex:1;border:none;background:transparent;height:50px;font-size:18px;outline:none;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 10px}
.chip{flex:none;min-height:38px;padding:0 12px;border-radius:19px;border:1.5px solid var(--line2);background:var(--surface);font-size:15px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip[hidden]{display:none}
.chip.more{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.result{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.thumb{width:68px;height:68px;border-radius:10px;object-fit:cover;object-position:top;background:#EDE8DE;flex:none;border:1px solid var(--line)}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;color:var(--accent)}
.result .t{font-weight:700;font-size:17px;line-height:1.4}
.result .o{font-size:16px;color:var(--ink2);margin-top:2px}
.result .d{font-size:14px;color:var(--muted);margin-top:4px}
.hitline{margin-top:6px;font-size:15px;background:var(--hit);border:1px solid var(--hit-line);border-radius:8px;padding:6px 10px;color:var(--hit-ink)}
mark{background:#FAD776;color:inherit;padding:0 1px;border-radius:2px}
/* card */
.card-head{padding:8px 12px 0;display:flex;flex-direction:column;gap:6px}
.card-top{display:flex;align-items:center;gap:4px}
.card-title{flex:1;font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.35}
.card-one{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--accent);line-height:1.45;padding:0 4px}
.add-ref{align-self:flex-start;min-height:44px;border:none;background:transparent;padding:0 4px;font-size:16px;color:var(--accent);font-weight:500}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 4px;font-size:15px;color:var(--ink2)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1.5px solid var(--line);margin-top:6px}
.tabs button{height:50px;border:none;background:transparent;font-size:18px;color:var(--ink2);font-weight:500;border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.banner{margin:14px 16px 0;background:#FFF1C9;border:1.5px solid var(--hit-line);border-radius:10px;padding:10px 14px;font-size:16px;color:var(--hit-ink)}
.core{margin:14px 16px 0;font-size:17px;line-height:1.65}
.core b{color:var(--accent)}
.jump{position:sticky;top:0;z-index:4;background:var(--bg);padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;border-bottom:1px solid #E6E0D4}
.jump button{height:44px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);font-size:16px;font-weight:500;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jump button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sections{padding:14px 16px 0;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:130px}
.sec.hit{background:var(--hit);border:2.5px solid var(--hit-line)}
.sec.playing{box-shadow:0 0 0 3px var(--accent) inset}
.sec-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sec-h h3{font-size:20px;line-height:1.4;padding-top:6px}
.play-sm{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--accent);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.sec .desc{font-size:18px;line-height:1.7}
.sec .scen{font-size:16px}
.sec .scen b{color:var(--accent)}
.sec .src{font-size:14px;color:var(--muted)}
.ext{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;font-weight:700;text-decoration:none}
.box{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.box h4{margin:0 0 4px;font-size:15px;color:var(--accent)}
.prompt{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;border-top:1px solid #EEE9DF;font-size:17px}
.prompt:first-of-type{border-top:none}
.copy{flex:none;min-height:40px;padding:0 12px;border-radius:8px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-size:15px;font-weight:500}
.rel{display:flex;justify-content:space-between;align-items:center;min-height:48px;text-decoration:none;font-size:17px;font-weight:500}
.review{display:flex;justify-content:center;padding:22px 16px 6px}
.manage{display:flex;justify-content:center;gap:24px;padding:18px 16px 8px;border-top:1px solid var(--line);margin:22px 16px 0}
.manage button{min-height:44px;border:none;background:transparent;font-size:16px;color:var(--ink2);text-decoration:underline}
.manage .del{color:var(--danger)}
.img-fit{margin:10px 12px 0;height:60vh;display:flex;align-items:flex-start;justify-content:center;padding:0;border:none;background:transparent;width:calc(100% - 24px)}
.img-fit img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.img-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 16px 0;min-height:48px;font-size:15px;color:var(--ink2)}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;border-top:1px solid #EEE9DF;font-size:16px}
.done-row .name{flex:1;min-width:0}
.done-row .acts{flex:none;display:flex;gap:8px}
/* reflections */
.form{margin:14px 16px 0;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:15px;font-weight:700;color:var(--accent);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fff;font-size:17px}
.field textarea{min-height:84px;resize:vertical;line-height:1.6}
.err{color:var(--danger);font-size:15px}
.timeline{margin:16px 16px 0;border-left:3px solid var(--accent);padding-left:16px;display:flex;flex-direction:column;gap:18px}
.tl-item .when{font-weight:700;font-size:17px}
.tl-item .when span{color:var(--accent)}
.tl-item p{margin:4px 0 0;font-size:17px}
.tl-item .lbl{font-size:14px;color:var(--muted);margin-top:6px}
.tl-del{border:none;background:transparent;color:var(--danger);font-size:15px;min-height:40px;padding:0}
/* player */
#player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--accent);color:#fff;display:none;align-items:center;gap:8px;padding:10px 10px calc(10px + var(--safe-b))}
#player.show{display:flex}
#player .lbl{flex:1;min-width:0;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .pos{flex:none;font-size:16px}
#player .rate{flex:none;height:44px;min-width:52px;border:1.5px solid #fff;border-radius:8px;background:transparent;color:#fff;font-size:16px}
.pbtn{width:50px;height:50px;border-radius:25px;border:none;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.menu{position:fixed;right:10px;bottom:calc(80px + var(--safe-b));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;min-width:200px;overflow:hidden}
.menu button{min-height:52px;border:none;background:transparent;text-align:left;padding:0 18px;font-size:17px;border-bottom:1px solid #EEE9DF}
.menu button:last-child{border-bottom:none}
/* teach */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:64px}
.mrow .t{font-weight:700;font-size:17px}
.mrow .s{font-size:15px;color:var(--ink2);margin-top:2px;line-height:1.5}
.mnum{flex:none;width:34px;height:34px;border-radius:17px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.mdone{flex:none}
.hint{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--muted)}
.flow{padding:0 16px;display:flex;flex-direction:column;align-items:stretch}
.node{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink)}
.node.static{border-color:var(--line2)}
.node.playing{background:#E2F0EC;box-shadow:0 0 0 3px var(--accent) inset}
.node .nn{flex:none;width:30px;height:30px;border-radius:15px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.node .nt{display:flex;flex-direction:column;gap:2px;line-height:1.55}
.node .nt b{font-size:18px}
.pr-hint{color:var(--hit-ink);background:var(--hit);border-radius:6px;padding:2px 6px;margin-top:2px}
.arrow{text-align:center;color:var(--accent);font-size:22px;line-height:1.3;font-weight:700}
.pr-time{font-family:var(--serif);font-size:52px;font-weight:700;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.pr-time.over{color:var(--danger)}
.pr-rec{display:flex;align-items:center;gap:8px;font-size:16px;min-height:44px}
.pr-rec input,.ck input{width:22px;height:22px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-size:17px;color:var(--ink);font-weight:400}
.ckchip{display:inline-flex;align-items:center;gap:6px}
.field label.ck{display:flex;margin:0;font-size:17px;font-weight:400;color:var(--ink)}
.field label.ckchip{display:inline-flex;margin:0;font-size:15px;font-weight:400;color:var(--ink)}
.ckchip input{width:18px;height:18px}
/* tabbar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:var(--safe-b)}
#tabbar.hide{display:none}
#tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:64px;text-decoration:none;color:var(--ink2);font-size:14px;font-weight:500}
#tabbar a.on{color:var(--accent);font-weight:700}
/* viewer */
#viewer{position:fixed;inset:0;z-index:50;background:#111;display:none;touch-action:none;overflow:hidden}
#viewer.show{display:block}
#viewer img{position:absolute;left:0;top:0;width:100vw;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#viewer .vclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:52px;height:52px;border-radius:26px;border:none;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:2}
#viewer .vhint{position:absolute;left:0;right:0;bottom:calc(16px + var(--safe-b));text-align:center;color:#fff;font-size:15px;opacity:.85;pointer-events:none}
/* import & settings */
.panel{margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:19px}
.panel p{margin:0;font-size:16px;color:var(--ink2)}
.panel textarea{width:100%;min-height:160px;border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:14px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.prev{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid #EEE9DF;font-size:16px}
.prev input{width:22px;height:22px}
.prev .st{font-size:14px;color:var(--muted)}
.prev .warn{color:var(--hit-ink);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.sec{transition:box-shadow .2s}}
</style>
</head>
<body>
<main id="view" class="view" aria-live="polite"></main>

<nav id="tabbar" aria-label="主選單">
  <a href="#/home" data-tab="home"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>首頁</a>
  <a href="#/library" data-tab="library"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>知識庫</a>
  <a href="#/teach" data-tab="teach"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20l4-4 4 4M7 8h6M7 11h9"/></svg>教學</a>
  <a href="#/import" data-tab="import"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>匯入</a>
  <a href="#/settings" data-tab="settings"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 6.2l2.1 2.1M17.7 15.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 17.8l2.1-2.1M17.7 8.3l2.1-2.1"/></svg>設定</a>
</nav>

<div id="player" role="region" aria-label="朗讀播放">
  <button class="pbtn" id="pPlay" aria-label="播放"></button>
  <div class="lbl" id="pLbl"></div>
  <div class="pos" id="pPos"></div>
  <button class="rate" id="pRate" aria-label="語速">1×</button>
  <button class="icon-btn" id="pMore" aria-label="更多播放選項"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
</div>

<div id="viewer" aria-modal="true" role="dialog" aria-label="查看圖片">
  <img id="vImg" alt="">
  <button class="vclose" id="vClose" aria-label="關閉圖片"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B1B1B" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="vhint">雙指縮放・拖曳移動・點兩下還原</div>
</div>

<script>
'use strict';
const APP_VERSION = '1.2.0';
const SCHEMA_VERSION = '1.0';
const CATEGORIES = ['思考方法','學習成長','領導管理','人際溝通','做人處世','人生觀','財經投資'];
const NATURES = ['原文','意譯','訪談整理','個人整理','待查證'];
const COOLDOWN_DAYS = 3;
const RATES = [0.8, 1, 1.25, 1.5];

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function daysSince(dateStr) {
  if (!dateStr) return null;
  const [y,m,d] = dateStr.slice(0,10).split('-').map(Number);
  const a = new Date(y, m-1, d), t = new Date(); t.setHours(0,0,0,0);
  return Math.round((t - a) / 86400000);

let db;

}
function idb(store, mode, fn) {

    t.onerror = () => rej(t.error);

}
const getAll = s => idb(s, 'readonly', t => t.objectStore(s).getAll());

/* ---------- Cloudinary ---------- */
function thumbUrl(url) { return url && url.includes('/upload/') ? url.replace('/upload/', '/upload/c_fill,g_north,w_200,h_200,q_auto,f_auto/') : url; }
function compressImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 2400; let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, MAX / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u);
      cv.toBlob(b => b ? res(b) : rej(new Error('圖片轉檔失敗')), 'image/webp', 0.92);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('無法讀取這張圖片')); };
    img.src = u;
  });
}

  const name = localStorage.getItem('cloudinary_name'), preset = localStorage.getItem('cloudinary_preset');
  const fd = new FormData(); fd.append('file', blob, cardId + '.webp'); fd.append('upload_preset', preset); fd.append('folder', 'wisdom-kb');
  const r = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(name)}/image/upload`, { method: 'POST', body: fd });
  const j = await r.json();

  const c = CARDS.get(cardId); c.image_url = j.secure_url; await saveCard(c);
}
async function uploadImage(cardId, file) {
  const name = localStorage.getItem('cloudinary_name'), preset = localStorage.getItem('cloudinary_preset');
  if (!name || !preset) { toast('請先到「設定」填寫 Cloudinary'); location.hash = '#/settings'; return false; }
  toast('壓縮並上傳中…');

/* ---------- search ---------- */
function cardFields(c) { return [c.title, c.one_liner, c.core, c.category, ...(c.tags||[]), ...(c.scenarios||[]), ...(c.sources||[])].join('\n'); }
function secFields(s) { return [s.rule, s.desc, s.chip, ...(s.keywords||[]), ...(s.scenarios||[])].join('\n'); }
function containsAny(token, words) { return (words||[]).filter(w => w && w.length >= 2 && token.includes(w)); }
function search(q) {
  const tokens = q.trim().split(/\s+/).filter(Boolean);
  if (!tokens.length) return null;
  const out = [];
  for (const c of CARDS.values()) {
    const cf = cardFields(c); let ok = true, score = 0; const terms = new Set(); const secScore = new Map();
    for (const tk of tokens) {
      let hit = false;
      if (cf.includes(tk)) { hit = true; score += 2; terms.add(tk); }
      const cw = containsAny(tk, [...(c.tags||[]), ...(c.scenarios||[])]);
      if (cw.length) { hit = true; score += cw.length; cw.forEach(w => terms.add(w)); }
      for (const s of c.sections || []) {
        let sh = 0;
        if (secFields(s).includes(tk)) { sh += 2; terms.add(tk); }
        const kw = containsAny(tk, [...(s.keywords||[]), ...(s.scenarios||[])]);
        if (kw.length) { sh += kw.length; kw.forEach(w => terms.add(w)); }
        if (sh) { hit = true; score += sh; secScore.set(s.id, (secScore.get(s.id)||0) + sh); }
      }
      if (!hit) { ok = false; break; }
    }
    if (!ok) continue;
    let best = null, bs = 0;
    for (const s of c.sections || []) { const v = secScore.get(s.id) || 0; if (v > bs) { bs = v; best = s; } }
    out.push({ card: c, score, sec: best, terms: [...terms].sort((a,b)=>b.length-a.length) });
  }
  return out.sort((a, b) => b.score - a.score);
}
function highlight(text, terms) {
  let h = esc(text);
  for (const t of terms) { const et = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); h = h.replace(new RegExp(et, 'g'), m => `<mark>${m}</mark>`); }
  return h.replace(/<mark><mark>(.*?)<\/mark><\/mark>/g, '<mark>$1</mark>');
}
function snippet(text, terms) {
  let pos = -1;
  for (const t of terms) { const i = text.indexOf(t); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  if (pos < 0) return text.length > 44 ? text.slice(0, 44) + '…' : text;
  const a = Math.max(0, pos - 16), b = Math.min(text.length, pos + 30);
  return (a > 0 ? '…' : '') + text.slice(a, b) + (b < text.length ? '…' : '');
}

/* ---------- home selection ---------- */
async function todayPicks(swap) {
  const t = today();
  const saved = await getMeta('home_today');
  if (!swap && saved && saved.date === t && saved.ids.length && saved.ids.every(id => CARDS.has(id) && isActive(id))) return saved.ids;
  const prevIds = swap && saved && saved.date === t ? saved.ids : [];
  const fresh = activeIds().filter(id => !prevIds.includes(id));
  const all = fresh;
  const cool = id => { const d = daysSince(userOf(id).last_reviewed_at); return d !== null && d < COOLDOWN_DAYS; };
  const reviewOrder = (a, b) => {
    const ua = userOf(a), ub = userOf(b);
    if (ua.is_important !== ub.is_important) return ua.is_important ? -1 : 1;
    const da = ua.last_reviewed_at || '', dbb = ub.last_reviewed_at || '';
    if (da !== dbb) return da < dbb ? -1 : 1;
    return ua.review_count - ub.review_count;
  };
  const exploreOrder = (a, b) => {
    const ua = userOf(a), ub = userOf(b);
    if (ua.is_important !== ub.is_important) return ua.is_important ? 1 : -1;
    if (ua.home_shown_count !== ub.home_shown_count) return ua.home_shown_count - ub.home_shown_count;
    const da = ua.last_home_shown_at || '', dbb = ub.last_home_shown_at || '';
    return da < dbb ? -1 : da > dbb ? 1 : 0;
  };
  const eligible = all.filter(id => !cool(id));
  const picks = eligible.slice().sort(reviewOrder).slice(0, 2);
  const ex = eligible.filter(id => !picks.includes(id)).sort(exploreOrder)[0];
  if (ex) picks.push(ex);
  if (picks.length < 3) all.filter(id => !picks.includes(id)).sort(reviewOrder).slice(0, 3 - picks.length).forEach(id => picks.push(id));
  if (picks.length < 3) prevIds.filter(id => !picks.includes(id)).sort(reviewOrder).slice(0, 3 - picks.length).forEach(id => picks.push(id));
  for (const id of picks) { const u = userOf(id); u.last_home_shown_at = t; u.home_shown_count += 1; await saveUser(u); }
  await setMeta('home_today', { date: t, ids: picks });
  return picks;
}

(() => {
  const el = $('#viewer');
  const clamp = () => {
    const img = $('#vImg'); const w = window.innerWidth * vw.s, h = img.naturalHeight * (window.innerWidth / (img.naturalWidth || 1)) * vw.s;
    const H = window.innerHeight;
    const W = window.innerWidth;

    vw.y = h <= H ? Math.min(Math.max(vw.y, 0), H - h) : Math.min(0, Math.max(H - h, vw.y));

    if (!it.checked) continue;
    const cur = CARDS.get(it.card.id);
    const { _image_data, ...card } = it.card; if (!card.image_url && cur && cur.image_url) card.image_url = cur.image_url;
    await saveCard(card);
    if (!USER.has(card.id)) await saveUser(newUser(card.id));
    ids.push(card.id); if (_image_data) withImg.push([card.id, _image_data]);
  }
  importState = { preview: null, done: ids };
  let failed = 0;
  if (withImg.length && !hasCloud()) failed = withImg.length;
  else for (const [i, [id, data]] of withImg.entries()) {
    toast(`上傳原圖 ${i + 1} / ${withImg.length}…`);
    try { const blob = await (await fetch(data)).blob(); await uploadBlob(id, blob); } catch (e) { failed++; }
  }
  toast(failed ? `已匯入 ${ids.length} 張卡；${failed} 張原圖未上傳${hasCloud() ? '，請按「上傳原圖」重試' : '，請先到「設定」填寫 Cloudinary'}` : `已匯入 ${ids.length} 張卡${withImg.length ? '，原圖已上傳' : ''}`);
  render(false);
}

/* ---------- settings ---------- */
async function renderSettings() {
  const last = await getMeta('last_backup_at'); const d = last ? daysSince(last) : null;
  let persisted = null; try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch (e) {}
  return `<h1 class="page-title">設定</h1>
    <div class="panel"><h3>Cloudinary（存放原圖）</h3><p>使用 Unsigned Upload Preset。請在 Cloudinary 後台限制格式、檔案大小與資料夾。</p>
      <div class="field"><label for="cName">Cloud name</label><input id="cName" value="${esc(localStorage.getItem('cloudinary_name') || '')}" autocomplete="off"></div>
      <div class="field"><label for="cPreset">Upload preset</label><input id="cPreset" value="${esc(localStorage.getItem('cloudinary_preset') || '')}" autocomplete="off"></div>
      <div class="btn-row"><button class="btn solid" data-act="savecloud">儲存設定</button></div></div>
    <div class="panel"><h3>備份與還原</h3>
      <div class="kv"><span>上次備份</span><b>${d === null ? '尚未備份' : d === 0 ? '今天' : d + ' 天前'}</b></div>
      <p>備份檔包含所有卡片、★、複習紀錄、體會與教學紀錄。原圖存在 Cloudinary，請另外保留在相簿或雲端硬碟。</p>
      <div class="btn-row"><button class="btn solid" data-act="backup">匯出完整備份</button><button class="btn danger" data-act="restore">從備份還原</button></div></div>
    <div class="panel"><h3>關於</h3>
      <div class="kv"><span>卡片數</span><b>${activeIds().length} 張${CARDS.size > activeIds().length ? `（另有封存 ${CARDS.size - activeIds().length} 張）` : ''}</b></div>
      <div class="kv"><span>永久儲存</span><b>${persisted === null ? '無法確認' : persisted ? '已啟用' : '未啟用'}</b></div>
      <div class="kv"><span>版本</span><b>v${APP_VERSION}</b></div></div>`;
}
async function doBackup() {
  const cards = [...CARDS.values()].map(c => ({ ...c, user: userOf(c.id) }));
  const data = { schema_version: SCHEMA_VERSION, exported_at: new Date().toISOString(), app_version: APP_VERSION, cards, teach: { learned: TEACH.learned, logs: TEACH.logs } };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `wisdom-kb-backup-${today().replaceAll('-', '')}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  await setMeta('last_backup_at', today()); toast('已匯出完整備份'); render(true);
}
function doRestore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json'; inp.className = 'hidden-file';
  inp.onchange = async () => {
    const f = inp.files[0]; inp.remove(); if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch (e) { toast('檔案不是有效的 JSON'); return; }
    if (!data.schema_version || !Array.isArray(data.cards)) { toast('這不是 APP 匯出的備份檔；卡片資料請用「匯入」'); return; }
    if (data.schema_version !== SCHEMA_VERSION) { toast(`備份格式 ${data.schema_version} 與目前 ${SCHEMA_VERSION} 不符，未還原`); return; }
    if (!confirm(`還原會用備份內容取代目前所有卡片與紀錄（備份共 ${data.cards.length} 張）。確定還原？`)) return;
    await idb(['cards', 'user'], 'readwrite', t => { t.objectStore('cards').clear(); t.objectStore('user').clear();
      for (const c of data.cards) { const { user, ...card } = c; t.objectStore('cards').put(card); t.objectStore('user').put({ ...newUser(card.id), ...(user || {}), card_id: card.id }); } });
    await setMeta('home_today', null);
    if (data.teach) { TEACH.learned = data.teach.learned || {}; TEACH.logs = data.teach.logs || []; await saveTeach(); }
    await loadAll(); toast(`已還原 ${data.cards.length} 張卡`); render(false);
  };
  document.body.appendChild(inp); inp.click();
}

/* ---------- actions ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  const c = route && route.name === 'card' ? CARDS.get(route.id) : null;
  const params = () => Object.fromEntries(route.q.entries());
  switch (act) {
    case 'learned': { const id = route.id; if (TEACH.learned[id]) delete TEACH.learned[id]; else TEACH.learned[id] = today(); await saveTeach(); render(true); break; }
    case 'settime': PR.target = Number(el.dataset.val); render(true); break;
    case 'prstart': await prStart(); break;
    case 'prstop': prStop(); break;
    case 'prsave': {
      const checks = [...document.querySelectorAll('input[name=prck]:checked')].map(x => x.value);
      const overall = (document.querySelector('input[name=prov]:checked') || {}).value || '普通';
      const audience = (document.querySelector('input[name=praud]:checked') || {}).value || '自己練習';
      TEACH.logs.push({ id: 'l' + Date.now(), at: new Date().toISOString(), date: today(), method: route.q.get('m'), card_id: route.q.get('c'), audience, overall, checks, note: $('#prNote').value.trim(), duration: Math.round(PR.elapsed) });
      await saveTeach(); practiceCleanup(); toast('已儲存教學紀錄'); go('#/teach'); break;
    }
    case 'dellog': { if (!confirm('刪除這筆教學紀錄？')) return; TEACH.logs = TEACH.logs.filter(l => l.id !== el.dataset.id); await saveTeach(); render(true); break; }
    case 'arch': libState.archive = !libState.archive; libState.scen = ''; render(true); break;
    case 'archive': case 'unarchive': {
      const u = userOf(c.id); u.archived = act === 'archive'; await saveUser(u);
      toast(u.archived ? '已封存，可在知識庫「封存區」找回' : '已恢復'); render(true); break;
    }
    case 'delcard': {
      if (!confirm(`刪除「${c.title}」？卡片內容、複習紀錄和體會都會一起刪除，無法復原。\n\n只是過時的話，建議改用「封存」。`)) return;
      const id = c.id;
      await idb(['cards', 'user'], 'readwrite', t => { t.objectStore('cards').delete(id); t.objectStore('user').delete(id); });
      CARDS.delete(id); USER.delete(id);
      const saved = await getMeta('home_today'); if (saved && saved.ids) { saved.ids = saved.ids.filter(x => x !== id); await setMeta('home_today', saved); }
      ttsStop(); toast('已刪除'); location.hash = '#/library'; break;
    }
    case 'swap': await todayPicks(true); render(true); toast('已換一批'); break;
    case 'random': { const ids = activeIds(); if (ids.length) go(`#/card/${encodeURIComponent(ids[Math.floor(Math.random() * ids.length)])}`); break; }
    case 'clearq': libState.q = ''; $('#q').value = ''; $('#results').innerHTML = libraryResults(); el.style.visibility = 'hidden'; $('#q').focus(); break;
    case 'cat': libState.cat = el.dataset.val; render(true); break;
    case 'star': if (c) { const u = userOf(c.id); u.is_important = !u.is_important; await saveUser(u); render(true); } else { libState.star = !libState.star; render(true); } break;
    case 'scen': libState.scen = el.dataset.val; render(true); break;
    case 'scenmore': libState.scenOpen = !libState.scenOpen; clampScen(); break;
    case 'back': if (history.length > 1) history.back(); else go('#/home'); break;
    case 'tab': { const p = params(); p.tab = el.dataset.val; delete p.form; history.replaceState(null, '', cardHash(c.id, p)); render(false); break; }
    case 'addref': { const p = params(); p.tab = 'reflect'; p.form = '1'; history.replaceState(null, '', cardHash(c.id, p)); render(false); break; }
    case 'cancelref': { const p = params(); delete p.form; history.replaceState(null, '', cardHash(c.id, p)); render(false); break; }
    case 'saveref': {
      const occ = $('#rOcc').value.trim();
      if (!occ) { $('#rErr').hidden = false; $('#rOcc').focus(); return; }
      const u = userOf(c.id);
      u.reflections = [...(u.reflections || []), { id: 'r' + Date.now(), date: $('#rDate').value || today(), occasion: occ, how_applied: $('#rHow').value.trim(), result: $('#rRes').value.trim() }];
      await saveUser(u); const p = params(); delete p.form; history.replaceState(null, '', cardHash(c.id, p)); toast('已儲存體會'); render(false); break;
    }
    case 'delref': { if (!confirm('刪除這筆體會？')) return; const u = userOf(c.id); u.reflections = u.reflections.filter(r => r.id !== el.dataset.id); await saveUser(u); render(true); break; }
    case 'review': {
      const u = userOf(c.id); const t = today();
      if (u.last_reviewed_at !== t) { u.review_count += 1; u.last_reviewed_at = t; await saveUser(u); }
      el.outerHTML = reviewBtn(u); break;
    }
    case 'jump': { const s = document.getElementById('sec-' + el.dataset.id); if (s) s.scrollIntoView({ block: 'start', behavior: 'smooth' }); const i = Number(s && s.dataset.idx); if (!tts.playing && !isNaN(i)) { tts.idx = i; updatePlayer(); } break; }
    case 'playsec': { const i = Number(el.dataset.idx); if (tts.playing && tts.idx === i && tts.mode === 'single') ttsStop(); else { tts.mode = 'single'; speakIdx(i); } break; }
    case 'copy': { const txt = c.prompts[Number(el.dataset.idx)]; try { await navigator.clipboard.writeText(txt); toast('已複製'); } catch (err) { toast('無法複製，請長按文字選取'); } break; }
    case 'viewer': openViewer(c.image_url); break;
    case 'upload': pickImageFor(c.id, () => render(true)); break;
    case 'upimg': pickImageFor(el.dataset.id, () => render(true)); break;
    case 'checkjson': { const t = $('#jsonIn').value.trim(); if (!t) { toast('請先貼上卡片 JSON'); return; } checkJson(t); render(true); break; }
    case 'pickjson': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json'; inp.className = 'hidden-file';
      inp.onchange = async () => { const f = inp.files[0]; inp.remove(); if (!f) return; if (isImageFile(f)) importState.preview = { errors: [IMG_MSG], items: [] }; else checkJson(await f.text()); render(true); };
      document.body.appendChild(inp); inp.click(); break;
    }
    case 'doimport': await doImport(); break;
    case 'cancelimport': importState.preview = null; render(true); break;
    case 'savecloud': localStorage.setItem('cloudinary_name', $('#cName').value.trim()); localStorage.setItem('cloudinary_preset', $('#cPreset').value.trim()); toast('已儲存設定'); break;
    case 'backup': await doBackup(); break;
    case 'restore': doRestore(); break;
  }
});

/* ---------- boot ---------- */
(async () => {
  db = await openDB();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  await loadAll(); await loadTeach();
  if (!location.hash) history.replaceState(null, '', '#/home');
  render(false);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
